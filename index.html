<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLAWS GROUP // UNDERGROUND ROLEPLAY & MEMORY EXPERIENCE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section -->
  <header class="hero-section">
    <div class="logo-container">
      <span class="logo-badge">Claws Logo</span>
    </div>
    <h1 class="main-title">WELCOME TO CLAWS GROUP</h1>
    <p class="main-subtitle">THE UNDERGROUND ROLEPLAY & MEMORY EXPERIENCE</p>
    
    <div class="hero-buttons">
      <button class="btn btn-primary" id="openModalBtn">⚡ PANEL GİRİŞİ</button>
      <a href="https://discord.gg" target="_blank" class="btn btn-secondary">DISCORD'A KATIL</a>
    </div>
  </header>

  <!-- Cinematic Carousel Section -->
  <section class="cinematic-section">
    <h2 class="cinematic-title">CINEMATIC</h2>
    <p class="cinematic-subtitle">EXPERIENCE</p>

    <div class="carousel-container">
      <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>

      <div class="carousel-track-container">
        <ul class="carousel-track" id="carouselTrack">
          <li class="carousel-card">
            <img src="https://via.placeholder.com/280x380/1a1a1a/e5a93c?text=Boris+Claws" alt="Boris Claws">
            <div class="card-overlay"><span>Boris Claws</span></div>
          </li>
          <li class="carousel-card active">
            <img src="https://via.placeholder.com/280x380/1a1a1a/e5a93c?text=Luna+Claws" alt="Luna Claws">
            <div class="card-overlay"><span>Luna Claws</span></div>
          </li>
          <li class="carousel-card">
            <img src="https://via.placeholder.com/280x380/1a1a1a/e5a93c?text=Mark+Claws" alt="Mark Claws">
            <div class="card-overlay"><span>Mark Claws</span></div>
          </li>
        </ul>
      </div>

      <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>
    </div>
  </section>

  <!-- Operatör Arşivi -->
  <main class="archive-section">
    <h2 class="archive-title">OPERATÖR ARŞİVİ</h2>
    <div class="channels-grid" id="channelsGrid"></div>
  </main>

  <!-- Giriş Modalı -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>TERMINAL ERIŞIMI</h2>
      <form id="loginForm">
        <label for="characterSelect">Karakter Seçin:</label>
        <select id="characterSelect">
          <option value="Boris Claws">Boris Claws</option>
          <option value="Luna Claws">Luna Claws</option>
          <option value="Mark Claws">Mark Claws</option>
          <option value="Geralt Claws">Geralt Claws</option>
          <option value="Beric Max">Beric Max</option>
          <option value="Nolan Claws">Nolan Claws</option>
          <option value="7. Karakter">7. Karakter</option>
        </select>

        <label for="characterPassword">Şifre:</label>
        <input type="password" id="characterPassword" placeholder="Şifrenizi girin..." required>

        <button type="submit" class="btn btn-primary">GİRİŞ YAP</button>
      </form>
    </div>
  </div>

  <!-- Panel & Yükleme Modalı -->
  <div id="uploadModal" class="modal">
    <div class="modal-content modal-large">
      <span class="close-upload">&times;</span>
      <h2 id="panelTitle">TERMINAL PANEL</h2>

      <div class="panel-section">
        <h3>Profil Ayarları</h3>
        <input type="text" id="profileImgUrl" placeholder="Profil Resim URL">
        <textarea id="characterBio" placeholder="Karakter Biyografisi..."></textarea>
        <button id="saveProfileBtn" class="btn btn-primary">Profili Kaydet</button>
      </div>

      <hr class="divider">

      <div class="panel-section">
        <h3>Yeni Anı / Video Yükle</h3>
        <input type="text" id="videoTitle" placeholder="Video Başlığı">
        <input type="text" id="videoUrl" placeholder="Video URL (.mp4 vb.)">
        <button id="uploadBtn" class="btn btn-primary">Anıyı Arşive İşle</button>
      </div>

      <hr class="divider">

      <div class="panel-section">
        <h3>Mevcut Anılarınız</h3>
        <div id="myVideosList"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
